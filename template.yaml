AWSTemplateFormatVersion: "2010-09-09"
Description: Mock data generator - private web UI on Lambda behind an internal ALB (no accounts, for sandboxed AWS accounts)

# =================================================
# PARAMETERS
# =================================================

Parameters:
  NamePrefix:
    Type: String
    Default: dq-poc-mock-data
    AllowedPattern: "^[a-z][a-z0-9-]{2,23}$"
    Description: Prefix for every resource name (lowercase, max 24 characters)
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with a route to a NAT gateway, in 3 different AZs (Redshift Serverless needs 3)
  AllowedCidr:
    Type: String
    Description: Network range users connect from (e.g. your VPC range if users come through AWS Client VPN or a host in the VPC)
  AllowedCidr2:
    Type: String
    Default: ""
    Description: Optional second range, e.g. your VPN's client pool (the address ipconfig shows while on the VPN)
  CodeBucket:
    Type: String
    Description: S3 bucket where you uploaded lambda-mock-gen.zip (same region as the stack)
  CodeKey:
    Type: String
    Default: lambda-mock-gen.zip
    Description: S3 key of the code zip
  AppBucket:
    Type: String
    Description: Existing S3 bucket. The app only uses mock-data/ (S3 datasets), mock-tables/ (Glue table files), dependencies/ (database registry) and staging/ (Redshift COPY files)
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN. If set, the UI is served over HTTPS on 443; otherwise plain HTTP on 80

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  NoCertificate: !Equals [!Ref CertificateArn, ""]
  HasSecondCidr: !Not [!Equals [!Ref AllowedCidr2, ""]]

Resources:
  # =================================================
  # NETWORK
  # =================================================

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${NamePrefix}-alb"
      GroupDescription: Mock data generator - load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !If [HasCertificate, 443, 80]
          ToPort: !If [HasCertificate, 443, 80]
          CidrIp: !Ref AllowedCidr
        - !If
          - HasSecondCidr
          - IpProtocol: tcp
            FromPort: !If [HasCertificate, 443, 80]
            ToPort: !If [HasCertificate, 443, 80]
            CidrIp: !Ref AllowedCidr2
          - !Ref AWS::NoValue

  # No inbound rules: the load balancer invokes the Lambda through AWS, not over the network.
  # Default outbound (all traffic) is required to reach AWS APIs through the NAT gateway and Postgres.
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${NamePrefix}-lambda"
      GroupDescription: Mock data generator - Lambda (outbound only, via NAT)
      VpcId: !Ref VpcId

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${NamePrefix}-db"
      GroupDescription: Mock data generator - Postgres and Redshift client access
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # The Lambda writes to Postgres directly
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
        # People connecting with SQL clients
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref AllowedCidr
        - IpProtocol: tcp
          FromPort: 5439
          ToPort: 5439
          CidrIp: !Ref AllowedCidr
        - !If
          - HasSecondCidr
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: !Ref AllowedCidr2
          - !Ref AWS::NoValue
        - !If
          - HasSecondCidr
          - IpProtocol: tcp
            FromPort: 5439
            ToPort: 5439
            CidrIp: !Ref AllowedCidr2
          - !Ref AWS::NoValue

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${NamePrefix}-subnets"
      DBSubnetGroupDescription: Mock data generator - Aurora Postgres
      SubnetIds: !Ref PrivateSubnetIds

  # =================================================
  # IAM: one role for the Lambda and for Redshift COPY, explicit permissions only (no AWS managed policies)
  # =================================================

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      # Fixed name so the role's own ARN can be used in its policy (iam:PassRole) without a circular reference
      RoleName: !Sub "${NamePrefix}-iam"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - redshift.amazonaws.com
                - redshift-serverless.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: mockgen
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Lambda basics: logs, and network interfaces to run in the VPC
              - Sid: LambdaLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Sid: LambdaVpcNetworking
                Effect: Allow
                Action: [ec2:CreateNetworkInterface, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
                Resource: "*"
              # DynamoDB data sources: any table name, but the app only replaces or deletes tables it tagged when creating them
              - Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:TagResource
                  - dynamodb:ListTagsOfResource
                  - dynamodb:BatchWriteItem
                  - dynamodb:Scan
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*"
              - Effect: Allow
                Action: dynamodb:ListTables
                Resource: "*"
              # App bucket: list it, and read/write only under its four prefixes (no bucket creation or deletion)
              #   mock-data/ S3 datasets, mock-tables/ Glue table files, dependencies/ database registry,
              #   staging/ Redshift COPY files (read by Redshift with this same role)
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${AppBucket}"
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource:
                  - !Sub "arn:aws:s3:::${AppBucket}/mock-data/*"
                  - !Sub "arn:aws:s3:::${AppBucket}/mock-tables/*"
                  - !Sub "arn:aws:s3:::${AppBucket}/dependencies/*"
                  - !Sub "arn:aws:s3:::${AppBucket}/staging/*"
              # Glue: only the mock_data database and its tables (created on first use)
              - Effect: Allow
                Action: [glue:GetDatabase, glue:CreateDatabase, glue:GetTable, glue:GetTables, glue:CreateTable, glue:DeleteTable]
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/mock_data"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/mock_data/*"
              # Create and delete Aurora Postgres clusters
              - Effect: Allow
                Action:
                  - rds:CreateDBCluster
                  - rds:CreateDBInstance
                  - rds:DeleteDBCluster
                  - rds:DeleteDBInstance
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                Resource: "*"
              # Create and delete Redshift Serverless namespaces and workgroups
              - Effect: Allow
                Action:
                  - redshift-serverless:CreateNamespace
                  - redshift-serverless:CreateWorkgroup
                  - redshift-serverless:DeleteNamespace
                  - redshift-serverless:DeleteWorkgroup
                  - redshift-serverless:GetNamespace
                  - redshift-serverless:GetWorkgroup
                  # Data API signs in as this role (no stored secret)
                  - redshift-serverless:GetCredentials
                Resource: "*"
              - Effect: Allow
                Action: [redshift-data:ExecuteStatement, redshift-data:BatchExecuteStatement, redshift-data:DescribeStatement, redshift-data:GetStatementResult]
                Resource: "*"
              # The app hands this same role to Redshift when it creates a database
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${NamePrefix}-iam"
              # Needed when RDS/Redshift create resources in the VPC for the first time
              - Effect: Allow
                Action: ec2:Describe*
                Resource: "*"
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName:
                      - rds.amazonaws.com
                      - redshift.amazonaws.com
                      - redshift-serverless.amazonaws.com

  # =================================================
  # APP
  # =================================================

  AppFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NamePrefix}-app"
      Description: Mock data generator UI and API
      # The zip's compiled libraries (pyarrow, fastavro) are built for exactly this runtime and architecture
      Runtime: python3.13
      Architectures: [x86_64]
      Handler: app.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt AppRole.Arn
      MemorySize: 2048
      Timeout: 900
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          APP_BUCKET: !Ref AppBucket
          DB_SUBNET_GROUP: !Ref DatabaseSubnetGroup
          DB_SECURITY_GROUP: !GetAtt DatabaseSecurityGroup.GroupId
          SUBNET_IDS: !Join [",", !Ref PrivateSubnetIds]
          REDSHIFT_ROLE_ARN: !GetAtt AppRole.Arn
          MOCKGEN_LOCAL: "false"

  AppPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AppFunction.Arn
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: AppPermission
    Properties:
      Name: !Sub "${NamePrefix}-tg"
      TargetType: lambda
      Targets:
        - Id: !GetAtt AppFunction.Arn

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${NamePrefix}-alb"
      Type: application
      Scheme: internal
      Subnets: !Ref PrivateSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        # Generating big tables can take minutes; match the Lambda timeout
        - Key: idle_timeout.timeout_seconds
          Value: "900"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

# =================================================
# OUTPUTS
# =================================================

Outputs:
  AppUrl:
    Description: Open this from inside the VPC / VPN. With a certificate, point a DNS name from the certificate at the load balancer instead
    Value: !If [HasCertificate, !Sub "https://${LoadBalancer.DNSName}", !Sub "http://${LoadBalancer.DNSName}"]
  FunctionName:
    Description: Lambda function. Re-upload lambda-mock-gen.zip here (Code -> Upload from -> Amazon S3 location) after a new build
    Value: !Ref AppFunction
  LogGroup:
    Description: CloudWatch log group with the app's errors
    Value: !Sub "/aws/lambda/${AppFunction}"
